name: Code regression tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r mammalian/Scripts/requirements-main-supp-n7.txt
      - run: python -m pip install -r yeast/requirements-plotting.txt
      - run: python -m unittest discover -s tests -v
        env:
          MPLBACKEND: Agg
          PYTHONUTF8: '1'
