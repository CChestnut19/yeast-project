name: Reproducibility checks
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: submission/requirements-lock.txt
      - run: python -m pip install -r submission/requirements-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python tools/run_submission_demo.py --output-dir Output/submission-demo
      - run: python tools/build_submission.py --output-dir Output/submission-archive
